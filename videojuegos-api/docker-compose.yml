services:
  db:
    image: postgres:16-alpine
    container_name: videojuegos_db
    environment:
      POSTGRES_DB: videojuegos_db
      POSTGRES_USER: video_user
      POSTGRES_PASSWORD: video_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: videojuegos_api
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: video_user
      DB_PASS: video_pass
      DB_NAME: videojuegos_db
    ports:
      - "3002:3000"
volumes:
  postgres_data:

