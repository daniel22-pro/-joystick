<div class="login-container">
  <h2>🎮 Iniciar Sesión</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" placeholder="ejemplo@correo.com" />
      <small *ngIf="email?.invalid && email?.touched">Correo no válido</small>
    </div>

    <div>
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" placeholder="********" />
      <small *ngIf="password?.invalid && password?.touched">Mínimo 6 caracteres</small>
    </div>

    <button type="submit" [disabled]="loginForm.invalid">Entrar</button>
  </form>
</div>
