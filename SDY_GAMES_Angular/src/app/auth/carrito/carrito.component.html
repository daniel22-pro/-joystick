<div class="carrito-wrapper">
  <div class="background-glow"></div>

  <!-- BOTÓN VOLVER AL INICIO (flotante, igual que en el detalle) -->
  <button class="back-home-btn" (click)="goHome()" title="Volver al inicio">
    <svg viewBox="0 0 24 24" class="icon">
      <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
    </svg>
    <span>VOLVER</span>
  </button>

  <div class="carrito-container">

    <h2 class="main-title">
      <span class="neon-text">TU CARRITO</span>
    </h2>

    <!-- LISTA DE JUEGOS -->
    <div class="carrito-lista" *ngIf="items.length > 0; else vacio">

      <div class="game-card" *ngFor="let juego of items; let i = index" 
           [style.animation-delay.ms]="i * 100">

        <div class="image-wrapper">
          <img [src]="juego.imagen_url" [alt]="juego.nombre" />
          <div class="image-glow"></div>
        </div>

        <div class="game-info">
          <h3 class="game-name">{{ juego.nombre }}</h3>
          <p class="game-genre">{{ juego.genero }}</p>
          <p class="game-platform">{{ juego.plataforma }}</p>
          
          <div class="price-quantity">
            <span class="price">${{ juego.precio }}</span>
            <span class="quantity">x{{ juego.cantidad }}</span>
          </div>

          <div class="subtotal">
            Subtotal: <strong>${{ juego.precio * juego.cantidad }}</strong>
          </div>
        </div>

        <button class="btn-remove" (click)="eliminarJuego(juego.id)">
          <svg viewBox="0 0 24 24">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>

      <!-- TOTAL Y COMPRAR -->
      <div class="checkout-section">
        <div class="total-box">
          <div class="total-label">TOTAL A PAGAR</div>
          <div class="total-amount">${{ total }}</div>
        </div>

        <button class="btn-checkout">
          <span>FINALIZAR COMPRA</span>
          <svg viewBox="0 0 24 24" class="arrow">
            <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- CARRITO VACÍO -->
    <ng-template #vacio>
      <div class="empty-cart">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24">
            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.76 1.38-.24 3.15 1.14 3.91C7.74 18.77 9.28 19 10.5 19H19v-2H10.5l1.1-2h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0022.4 6H6.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
        </div>
        <h3>Tu carrito está vacío</h3>
        <p>¡Explora los mejores juegos y agrégalos aquí!</p>
        <button class="btn-explore" (click)="goHome()">IR A EXPLORAR</button>
      </div>
    </ng-template>

  </div>
</div>
