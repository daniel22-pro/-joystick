<div class="register-container">
  <h2>Crear cuenta</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Nombre completo</label>
      <input formControlName="nombre" placeholder="Ingresa tu nombre" />
      <small *ngIf="registerForm.get('nombre')?.invalid && registerForm.get('nombre')?.touched">
        Nombre inválido
      </small>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="correo@ejemplo.com" />
      <small *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
        Correo no válido
      </small>
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" formControlName="password" placeholder="Mínimo 6 caracteres" />
    </div>

    <div class="form-group">
      <label>Confirmar contraseña</label>
      <input type="password" formControlName="confirmPassword" placeholder="Repite tu contraseña" />
    </div>

    <button type="submit" [disabled]="registerForm.invalid">Registrarse</button>
  </form>
</div>
