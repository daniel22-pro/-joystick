<section class="register-game-wrapper">
  <div class="p-card">
    <h2>🎮 Registrar Nuevo Juego</h2>

    <form [formGroup]="registerGameForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="title">Título del juego</label>
        <input id="title" type="text" formControlName="title" placeholder="Ej. The Legend of Zelda" />
      </div>

      <div class="form-group">
        <label for="genre">Género</label>
        <select id="genre" formControlName="genre">
          <option value="">Seleccione...</option>
          <option value="accion">Acción</option>
          <option value="aventura">Aventura</option>
          <option value="deportes">Deportes</option>
          <option value="estrategia">Estrategia</option>
          <option value="rpg">RPG</option>
        </select>
      </div>

      <div class="form-inline">
        <div class="form-group">
          <label for="price">Precio (USD)</label>
          <input id="price" type="number" formControlName="price" min="0" />
        </div>
        <div class="form-group">
          <label for="releaseDate">Fecha de lanzamiento</label>
          <input id="releaseDate" type="date" formControlName="releaseDate" />
        </div>
